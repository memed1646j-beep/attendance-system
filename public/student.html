<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور - بوابة الطالب</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="student-body">

    <header class="dash-header">
        <div class="header-titles">
            <h2>بوابة تسجيل الحضور</h2>
            <p>الكلية التقنية / كركوك</p>
        </div>
    </header>

    <main class="student-container">
        <div class="scanner-card student-section" id="scannerCard">
            <h3>مسح الباركود (QR Code) 📷</h3>
            <p>قم بتوجيه كاميرا هاتفك نحو الباركود المعروض.</p>
            <div id="reader" class="camera-box"></div>
            <button id="startScanBtn" class="primary-btn" style="padding: 10px 20px; background: #2b6cb0; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer;">افتح الكاميرا</button>
            <button id="stopScanBtn" class="danger-btn" style="display: none; padding: 10px 20px; background: #e53e3e; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer;">إيقاف الكاميرا</button>
            <div id="scanResult" class="result-message" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </div>

        <div id="historySection" class="student-section" style="display: none; padding: 20px; background: white; border-radius: 8px;">
            <h3>سجل الحضور 📋</h3>
            <p style="color: #718096; text-align: center;">قريباً سيتم عرض سجل حضورك هنا.</p>
        </div>

        <div id="profileSection" class="student-section" style="display: none; padding: 20px; background: white; border-radius: 8px; text-align: center;">
            <h3>الملف الشخصي 👤</h3>
            <div id="studentInfoDisplay" style="margin-bottom: 20px; padding: 10px; background: #edf2f7; border-radius: 5px;"></div>
            <button id="logoutBtn" class="danger-btn" style="background-color: #e53e3e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">تسجيل الخروج</button>
        </div>
    </main>

    <nav class="student-nav">
        <button class="nav-btn active" id="nav-scan">📷<br>الماسح</button>
        <button class="nav-btn" id="nav-history">📋<br>سجلي</button>
        <button class="nav-btn" id="nav-profile">👤<br>حسابي</button>
    </nav>

    <script src="student-app.js"></script>
</body>
</html>
